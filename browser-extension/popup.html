<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      color: #38bdf8;
    }
    .url-box {
      font-family: monospace;
      font-size: 11px;
      background-color: #020617;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      word-break: break-all;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #020617;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    #result {
      margin-top: 12px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>SafeSurf AI Inspector</h2>
  </div>
  <div class="url-box" id="activeUrl">Loading current tab...</div>
  <button id="scanBtn">Scan Active Tab</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>
</html>
